docform/: Copyable offline library folder
  docform.js: Offline entry with feature profiles, local asset loading, author lifecycle hooks, and diagnostics
  docform.css: Optional static reading-profile styles
  site.template.js: Starter JSON site manifest to copy beside pages
  css/: Design tokens, base typography, and per-module styles
    tokens.css: Notion-style named colours, chart series colours, neutrals, link and cross-reference colours, per-mode heading and emphasis colours, spacing, radii, fonts, and reading-column and wide-block widths via light-dark()
    base.css: Centered reading column, typography, links, concept tables, table hover, list markers, scrollbars, and data-df-color accents
    roles.css: Roles legend styles
    nav.css: Sidebar tree, collapsible outline, numbered subsection rail, resize handle, heading links, prev/next links, and drawer
    theme.css: Theme toggle button styles
    controls.css: Top-left frosted control pill, progress ring, hover-aware focus-mode blur, hideable sidebar, and near-edge page scrollbar
    math.css: Display math layout and inline TeX error styles
    blocks.css: Inline tags, callouts, and the no-script tinted card look of details
    tooltip.css: Tooltip box, hold-to-expand card with progress ring, and dotted term underlines (fainter for auto-linked terms)
    code.css: Code block bar, copy button, token colours, highlighted lines, circled annotation markers, and diff rows
    tabs.css: Tab list and panels with a no-JS fallback
    anim.css: Figure frames, animation controls, and SVG paint utilities
    params.css: Parameter slider, choice, and switch rows, preset buttons, and bound values
    reveal.css: Scroll reveals, two-way callout slides, and split views with side-gliding panes
    steps.css: Shared selector with a muted small-caps title, titled card groups, a sliding highlight, and animated bold labels, plus an independently scrolling detail pane for standalone cards and figure steps and optional title-only side cards
    zoom.css: Frosted full-screen figure zoom view
    zoomtools.css: Zoom-view tool pill, magnifier lens, laser dot and trail, ink, crosshair and ruler readouts
    bubble.css: Tinted peek bubbles and the frosted side panel, blurred except while hovered
    refs.css: Caption and equation numbers, reference flash, preview cards, citations, and reference lists
    notes.css: Margin sidenotes, note markers, and the no-script inline aside
    search.css: Frosted Ctrl+K search dialog with highlighted results
    chart.css: Chart legend with series toggles, grid, thin marks, dashed reference lines, selected points, range brush and Reset, empty-state message, hover readout, and table view
    results.css: Sortable results-table headers, heatmap shading, best-in-column values, threshold rules with pass/fail text, and column filter menus with a chip and row-count bar
    highlight.css: Outlines for selected items in linked views
    stepper.css: Worked-example step controls and linked view visibility
    scenarios.css: Variant controls and changed comparison cells
    wide.css: Wide-block margins and their glide when the sidebar moves
    data.css: Data-block parse errors, size notices, and show-more rows
    tree.css: Data-tree rows with disclosure arrows, typed values, and expand and collapse buttons
    dropzone.css: Dashed file drop area, status line with Reset, and the dropped file's view
    glossary.css: Glossary page letter jumps, letter groups, definitions, variant definitions, and used-on links
  js/: Per-module classic scripts on a shared DocForm namespace
    core.js: DocForm namespace, module registry, data-df-* and clipboard helpers, heading slugs, glossary term keys, manifest normalization including the glossary page entry
    roles.js: Manifest role colours as CSS variables and data-df-legend rendering
    nav.js: Sidebar tree and heading outlines with hover groups, numbered subsection progress, scroll-spy, resizing, heading and prev/next links, and drawer API
    theme.js: Head-loaded light and dark theme switching with saved choice and toggles
    controls.js: Control pill with reading progress, focus mode, three saved sidebar modes, search and theme buttons, and shortcuts
    math.js: KaTeX rendering of .df-math elements with manifest macros, inline errors, a re-render API, and $…$ text helpers
    tooltip.js: data-df-tip tooltips, glossary terms with hold-to-expand extended text, opt-in automatic term linking, and lazy HTML cards for other modules
    code.js: Code block copy buttons, a dependency-free JS, JSON, YAML, Python, HTML, CSS, shell, SQL, and C# highlighter, line highlights, annotation markers linked to list items, and diffs
    tabs.js: Accessible keyed tab panels with keyboard navigation and selection groups
    anim.js: SVG timelines with playback controls, hover-to-play, and keyed jumps for figure steps
    params.js: data-df-param sliders, selects, and toggles, validated data-df-preset batch updates, data-df-bind/data-df-template outputs, and a subscription API
    reveal.js: Two-way callout slides, one-time data-df-reveal fade-ins, and split panes
    steps.js: Standalone HTML card panels with optional titled groups, keyboard focus, and manual selection, plus figure steps selected by hover, focus, tap, or page controls, with keyed selection and inert details
    zoom.js: Click or Enter opens page images and figures full screen; Escape or backdrop closes; open and close events for add-ons
    zoomtools.js: Presentation tools in the zoom view: cursor, live-clone magnifier, laser pointer, pen and highlighter ink with Undo and Clear, chart crosshair, and a ruler on other figures
    bubble.js: Turns details into peek bubbles that open into stacked right-gutter panels near the viewport centre
    refs.js: Numbered figures, tables, and equations, filled reference links with hover previews, and manifest-bibliography citations with a reference list
    notes.js: Inline .df-note footnotes shown as margin sidenotes when there is room, else as hover notes
    search.js: Ctrl+K search palette over the current page and a script-global site index, plus the index extractor (sections, inline tips, and glossary-term uses), ranking, and indexed page list
    chart.js: Dependency-free SVG line, bar, and scatter charts from inline JSON or tables, with UTC time x-axes, validated base-10 log axes, line gaps, labelled reference lines, keyed point selection through shared groups, legend series toggles, opt-in x-range brushing with keyboard zoom and Reset, optional y rescaling, hover readouts, data coordinates under a viewport point, a table view of what is shown, and spec updates that can restore the source table
    results.js: Sortable results tables with heatmap shading on column or fixed ranges, best-in-column highlighting, labelled pass/fail thresholds, and opt-in value, number, and date column filters plus named filter chips that reshade over visible rows
    highlight.js: Shared keyed selection controller with startup seeds, persistence, and passive HTML and SVG participants
    stepper.js: Ordered worked examples with Previous, Next, Reset, keyed selection groups, and linked step views
    scenarios.js: Table-backed single-condition or multi-condition configuration comparisons with fixed baselines, shared chart scales by unit, and Reset
    data.js: Named CSV, JSON, and YAML data from wrapped files or inline blocks, with quoted-CSV and core-schema YAML parsing, size and row caps, inline parse errors, results-table, code, or tree views, and show/restore of other entries
    tree.js: Collapsible, keyboard-navigable tree view of nested data with expand-all, collapse-all, and capped child lists
    dropzone.js: Reader file dropzones that check type and size, read files locally, and show them or feed a target chart, data block, or results table with Reset
    glossary.js: data-df-glossary site glossary merging manifest entries with indexed inline tips, with variant definitions, used-on back-links, letter jumps, and a manifest-only fallback
    wide.js: data-df-wide figures and table wrappers that grow beside the reading column, bounded by the sidebar and right-margin notes or panels
  tools/search-index.html: Offline page that builds search-index.js, including auto-linked and hand-marked glossary terms and inline tips, from a chosen docs folder
  tools/data-file.html: Offline page that wraps CSV, JSON, and YAML files as registering data scripts and flags files over the default caps
  vendor/katex/: Pinned KaTeX 0.19.1 minified script, stylesheet, woff2 fonts, and MIT license
  vendor/js-yaml/: Pinned js-yaml 4.1.0 minified script and MIT license
  docs/: Agent-facing setup, layout, reading, interaction, and data references grouped by purpose
    LIB_MAP.tsv: Index of agent references by component, description, and relative path
docs/: Human-facing getting started guide, include order, manifest and component references, and style guide
examples/: Offline example sites with index.html entry points, chapters in pages/, and supporting files in assets/
  pca/: Pump monitoring case study with interactive projection cards, baseline recipe cards with language tabs, residual exercises, threshold comparisons, linked telemetry, figure zoom, and an offline glossary and search
  transformers/: Decoder-only guide with a concept table, linked attention trace, decoding presets, log-scale sweep, figure zoom, and training diagnostics with artifact cards, filterable runs, data trees, file dropzones, and offline search
tests/: Built-in node:test checks of module logic
