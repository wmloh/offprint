docform/: Copyable offline library folder
  site.template.js: Starter window.DocFormSite manifest to copy beside pages
  css/: Design tokens, base typography, and per-module styles
    tokens.css: Notion-style named colours, chart series colours, neutrals, link and cross-reference colours, per-mode heading and emphasis colours, spacing, radii, fonts, and reading-column and wide-block widths via light-dark()
    base.css: Page layout with sidebar slot, reading-column typography, blue links, row and column table hover, tinted list markers, hover-revealed scrollbars, data-df-color accents
    roles.css: Roles legend styles
    nav.css: Sidebar tree, collapsible page outline, resize handle, heading copy-link buttons, prev/next links, and narrow-screen drawer
    theme.css: Theme toggle button styles
    controls.css: Top-left frosted control pill, progress ring, hover-aware focus-mode blur, hideable sidebar, and near-edge page scrollbar
    math.css: Display math layout and inline TeX error styles
    blocks.css: Inline tags, callouts, and the no-script tinted card look of details
    tooltip.css: Tooltip box, hold-to-expand card with progress ring, and dotted term underlines (fainter for auto-linked terms)
    code.css: Code block bar, copy button, token colours, highlighted lines, circled annotation markers, and diff rows
    tabs.css: Tab list and panels with a no-JS fallback
    anim.css: Figure frames, animation controls, and SVG paint utilities
    params.css: Parameter slider, choice, and switch rows, preset buttons, and bound values
    reveal.css: Scroll reveal offsets and split-view grid with side-gliding panes
    steps.css: Full-width figures with step details and optional title-only side cards
    zoom.css: Frosted full-screen figure zoom view
    bubble.css: Tinted peek bubbles and the frosted side panel, blurred except while hovered
    refs.css: Caption and equation numbers, reference flash, preview cards, citations, and reference lists
    notes.css: Margin sidenotes, note markers, and the no-script inline aside
    search.css: Frosted Ctrl+K search dialog with highlighted results
    chart.css: Chart legend, grid, thin marks, dashed reference lines, selected points, hover readout, and table view
    results.css: Sortable results-table headers, heatmap shading, best-in-column values, and threshold rules with pass/fail text
    highlight.css: Outlines for selected items in linked views
    stepper.css: Worked-example step controls and linked view visibility
    scenarios.css: Variant controls and changed comparison cells
    wide.css: Wide-block margins and their glide when the sidebar moves
    data.css: Data-block parse errors, size notices, and show-more rows
  js/: Per-module classic scripts on a shared DocForm namespace
    core.js: DocForm namespace, module registry, data-df-* and clipboard helpers, heading slugs, manifest normalization
    roles.js: Manifest role colours as CSS variables and data-df-legend rendering
    nav.js: Sidebar page tree and heading outline (other pages via the search index) with animated groups that open on hover until the pointer leaves the sidebar, resizable sidebar width, heading copy links, scroll-spy, prev/next links, and drawer API
    theme.js: Head-loaded light and dark theme switching with saved choice and toggles
    controls.js: Control pill with reading progress, saved focus mode and sidebar state, search and theme buttons, and keyboard shortcuts
    math.js: KaTeX rendering of .df-math elements with manifest macros, inline errors, a re-render API, and $…$ text helpers
    tooltip.js: data-df-tip tooltips, glossary terms with hold-to-expand extended text, opt-in automatic term linking, and lazy HTML cards for other modules
    code.js: Code block copy buttons, a dependency-free JS, JSON, YAML, Python, HTML, CSS, shell, SQL, and C# highlighter, line highlights, annotation markers linked to list items, and diffs
    tabs.js: Accessible tabbed panels with keyboard navigation and synced groups
    anim.js: DocForm.anim step-timeline SVG animations with playback controls, hover-to-play, and animated step jumps
    params.js: data-df-param sliders, selects, and toggles, validated data-df-preset batch updates, data-df-bind/data-df-template outputs, and a subscription API
    reveal.js: One-time data-df-reveal fade-ins and .df-split side-by-side panes
    steps.js: Figure steps selected by hover, focus, tap, or other page controls
    zoom.js: Click or Enter opens page images and figures full screen; Escape or backdrop closes
    bubble.js: Turns details into peek bubbles that open into stacked right-gutter panels near the viewport centre
    refs.js: Numbered figures, tables, and equations, filled reference links with hover previews, and manifest-bibliography citations with a reference list
    notes.js: Inline .df-note footnotes shown as margin sidenotes when there is room, else as hover notes
    search.js: Ctrl+K search palette over the current page and a script-global site index, plus the index extractor, ranking, and indexed page list
    chart.js: Dependency-free SVG line, bar, and scatter charts from inline JSON or tables, with UTC time x-axes, validated base-10 log axes, line gaps, labelled reference lines, keyed point selection through linked highlighting, hover readouts, and a table view
    results.js: Sortable results tables with heatmap shading on column or fixed ranges, best-in-column highlighting, and labelled pass/fail thresholds
    highlight.js: Group-scoped linked selection across prose, tables, figures, and code annotations
    stepper.js: Ordered worked examples with Previous, Next, Reset, keyed step selection, and linked step views
    scenarios.js: Table-backed single-condition or multi-condition configuration comparisons with fixed baselines, shared chart scales by unit, and Reset
    data.js: Named CSV, JSON, and YAML data from wrapped files or inline blocks, with quoted-CSV and core-schema YAML parsing, size and row caps, inline parse errors, and results-table or code views
    wide.js: data-df-wide figures and table wrappers that grow beside the reading column, bounded by the sidebar and right-margin notes or panels
  tools/search-index.html: Offline page that builds search-index.js from a chosen docs folder
  tools/data-file.html: Offline page that wraps CSV, JSON, and YAML files as registering data scripts and flags files over the default caps
  vendor/katex/: Pinned KaTeX 0.19.1 minified script, stylesheet, woff2 fonts, and MIT license
  vendor/js-yaml/: Pinned js-yaml 4.1.0 minified script and MIT license
  docs/: Usage guide: getting started, include order, manifest and component references, style guide
examples/: Example docs opened from file://
  simple/: Pythagorean theorem with a proof, an animated construction, and prediction exercises
  linear-algebra/: Five-page notes with a matrix-vector stepper, interactive SVG planes, and computing examples including solver tables against a time budget
  pca/: Three-chapter pump monitoring case study with projection steps, residual exercises, a wide trace and scores table, alert comparisons, and offline search
  transformers/: Three-chapter decoder-only Transformer guide with a linked attention trace, next-token probabilities, decoding-setup presets, a log-scale learning-rate sweep, and offline search
  experiment-results/: Model-sweep leaderboard, paged run table, YAML configuration, inline data, size notice, and parse error from wrapped data files
  sales-pipeline/: Retry trace linking steps, event rows on two clocks, and a keyed chart, a comparison of sales totals, SQL and C# deduplication snippets, and batch arrivals on a time axis
tests/: Built-in node:test checks of module logic
