docform/: Copyable offline library folder
  docform.js: Offline entry with feature profiles, local asset loading, author lifecycle hooks, diagnostics, and lazy standalone export controls
  docform.css: Optional static reading-profile styles
  site.template.js: Starter JSON site manifest to copy beside pages
  css/: Design tokens, base typography, and per-module styles
    tokens.css: Notion-style named colours, chart series colours, neutrals, link and cross-reference colours, per-mode heading and emphasis colours, spacing, radii, fonts, reading-column and figure-cap widths, section spacing and colour cycle, and eyebrow and field-label text roles via light-dark()
    base.css: Centered reading column, typography, section heading spacing, links, figure and table width limits, concept tables, table hover, list markers, scrollbars, and data-df-color accents
    text.css: Muted small-caps eyebrows and aligned labelled-field lists for visual hierarchy
    sections.css: Cycled h2 section colours and uniform left-margin section lines in an unblurred overlay layer
    buttons.css: Shared soft tinted pill buttons with optional icons for author and module actions, and the frosted icon pill for step controls
    roles.css: Roles legend styles
    nav.css: Sidebar tree with group dividers and section links, numbered subsection rail, resize handle, heading links, prev/next links, and drawer
    theme.css: Theme toggle button styles
    controls.css: Top-left frosted reading and page navigation pills, hover-aware focus-mode blur, hideable sidebar, and near-edge page scrollbar
    export-dialog.css: Responsive reader export dialog, folder pickers, page picker, preview, and saved-data section
    math.css: Display math layout and inline TeX error styles
    blocks.css: Inline tags with class-shape markers and unclassified outlines, callouts, and the no-script tinted card look of details
    tooltip.css: Tooltip box with a glossary tag line, hold-to-expand card with progress ring, and dotted term underlines (fainter for auto-linked terms, red for untagged tips, none on tags)
    code.css: Code block bar, copy button, token colours, highlighted lines, circled annotation markers, and diff rows
    editable-text.css: Inline and multiline text fields with a syntax colour layer
    dropdowns.css: Theme-aware popovers, expanded menu branches, and opening and closing transitions
    tabs.css: Tab list and panels with a no-JS fallback
    anim.css: Figure frames, animation controls, and SVG paint utilities
    choices.css: Shared choice fieldsets with eyebrow legends, borderless tinted chips, a sliding single-choice highlight, check marks, the restyled combobox, and the press ripple
    params.css: Unboxed parameter wrappers, sliders, switches, preset buttons, bound values, and show-when fades
    reveal.css: Two-way scroll reveals with entrance-only delays, two-way callout slides, and split views with side-gliding panes
    steps.css: Shared selector with a muted small-caps title, titled card groups, a sliding highlight, and animated bold labels, plus the side-by-side detail layout for standalone cards and figure steps, optional title-only side cards, number circles, right-aligned tags, and the inline filter box
    detail.css: Standalone detail panes with overlapping, independently scrolling details and the shared hover scrollbar
    pipeline.css: Pipeline blocks with collapsing fields, curved line styles, moving dashes, edge labels, path tracing, step reveals, side or below detail panes, and a numbered-list fallback
    sequence.css: Participant headers, message controls, arrows, and lifelines
    tree-diagram.css: Tree cards, disclosure controls, and animated branch positions
    timeline.css: Responsive timeline axes, lane labels, point and span event controls, and a print list
    zoom.css: Frosted full-screen figure zoom view
    zoomtools.css: Zoom-view tool pill, magnifier lens, laser dot and trail, ink, crosshair and ruler readouts
    bubble.css: Tinted peek bubbles that grow in place, with content blurred except while hovered and scrolling that passes to the page at their ends
    refs.css: Caption and equation numbers, reference flash, preview cards, citations, and reference lists
    notes.css: Margin sidenotes, note markers, and the no-script inline aside
    search.css: Animated frosted search dialog with highlighted results
    chart.css: Chart legend, opt-in series and slice toggle chips, plot marks hidden until their entrance except in print and lens clones, reference lines, selection, range brush, shared cursor, readout, and table view
    chart-intervals.css: Interval whisker and lollipop stem styling
    chart-histogram.css: Overlaid histogram bar opacity and active-bin styling
    chart-heatmap.css: Heatmap cell hues over a neutral backdrop, dimmed out-of-range cells, contour lines and labels with their toggle chip, and the side colour scale
    chart-playback.css: Guided playback pill spacing, playhead, checkpoint marker, and note visibility
    results.css: Sortable results-table headers, heatmap shading, best-in-column values, threshold rules with pass/fail text, and column filter menus with blue choice chips and a row-count bar
    matrix.css: Evaluation matrix measure chooser layout, numeric cells, and shared color scale
    highlight.css: Tinted highlight with a fading leading accent edge for selected items in linked views, tinted rows, and glowing SVG shapes
    stepper.css: Worked-example step pill spacing and linked view visibility
    scenarios.css: Variant chooser and changed comparison cells
    data.css: Data-block parse errors, size notices, and show-more rows
    tree.css: Data-tree rows with disclosure arrows, typed values, and expand and collapse buttons
    dropzone.css: Dashed file drop area, status line with Reset, and the dropped file's view
    glossary.css: Glossary page tag filter chips, letter jumps, letter groups, definitions with tags, variant definitions, and used-on links
  js/: Per-module classic scripts on a shared DocForm namespace
    reader-state.js: Versioned browser-local export views, data revision checks, import persistence, and in-memory Interactive session replay
    page-snapshot.js: Page capture, isolated replay, reachable figure steps and details, tooltip materialization, and fallback reporting for export
    export-package.js: Folder and manifest resolution, authored Interactive inputs, consented datasets and local scripts, shared assets, Reader fallbacks, link rewriting, and build diagnostics
    export-library.js: Generated library styles and KaTeX fonts loaded on demand for standalone exports
    export-runtime.js: Generated trusted classic scripts loaded on demand for Interactive exports
    export-resources.js: Offline resolution and content-based sharing of stylesheets, fonts, and images
    export-reader.js: Active-page Interactive startup and session replay for cards, diagrams, charts, and linked views, isolated author pages, Reader capture with declarative steps, and shared navigation, history, reading controls, and tooltips
    export-dialog.js: Reader and Interactive mode selection, folder and page pickers, preview and consent for imports and author scripts, cancellation, download, and saved-data clearing
    core.js: DocForm namespace, module and shortcut registries, data-df-* and clipboard helpers, data-df-max-width limits, the shared sequence registry, controller, events, group binding, and step pill, heading slugs, glossary term keys, tag shapes and the tag class registry, manifest normalization including the glossary page entry
    roles.js: Manifest role colours as CSS variables, role tips, and data-df-legend rendering with tooltips
    nav.js: Sidebar tree and h1 outlines, subsection progress rail, resizing, heading and prev/next links, and a subscribable drawer
    theme.js: Light and dark theme state, saved preferences, and mountable toggles
    controls.js: Reading controls, floating previous and next page links, saved sidebar modes, and heading shortcuts
    math.js: KaTeX rendering of .df-math elements with manifest macros, inline errors, a re-render API, and $…$ text helpers
    tooltip.js: data-df-tip tooltips, glossary terms with hold-to-expand extended text and required glossary tags, glossary-labelled tags, required tag classes and tooltips with warned fallbacks, opt-in automatic term linking, and lazy HTML cards for other modules
    code.js: Code block copy buttons, a dependency-free JS, JSON, YAML, Python, HTML, CSS, shell, SQL, and C# highlighter, line highlights, annotation markers linked to list items, and diffs
    editable-text.js: Native text fields with optional live syntax highlighting
    dropdowns.js: Viewport-positioned native popovers for links, actions, and nested menu branches, with a shared positioning helper
    tabs.js: Accessible keyed tab panels with keyboard navigation and selection groups
    anim.js: Declarative and programmatic SVG timelines with keyed steps, playback, scrubbing, and Reader endpoints
    choices.js: Shared builder for every single or multiple choice: authored or generated fieldset chips or a searchable combobox, keyboard support, and a press ripple
    params.js: Named parameter scopes with fieldset choice groups, presets, text bindings, show-when conditions, selection-group choices, links that let other features reject updates, atomic updates, Reset, and subscriptions
    reveal.js: Two-way callout slides, data-df-reveal entrances that replay around the viewport centre (or once), and split panes
    steps.js: Standalone HTML cards and figure steps with hover selection, keyboard and tap support, keyed selection, inert details, optional numbering, tag slots, and label-and-tag filtering, both usable as detail-pane sources
    detail.js: Shared detail panes keyed to card panels, figure steps, pipelines, or selection groups, plus inert-detail and scrollbar helpers
    diagram.js: Internal diagram geometry and SVG helpers, keyed node selection, detail-pane binding, and a record diagram adapter
    pipeline.js: Pipeline block diagrams with structured fields and overrides, ranked half-row layout, curved routing with fork and merge stems, junctions, crossing gaps, path tracing, keyboard navigation, shared keyed reveal steps, and detail panes
    sequence-diagram.js: Ordered messages and participant lifelines from markup or named records
    tree-diagram.js: Collapsible visual hierarchy, animated layout, and keyed node selection
    timeline.js: Numeric and calendar timelines from markup or named records, with lane packing, keyed selection, and detail panes
    zoom.js: Full-screen images and figures with subscribable state and a teardown event for extensions
    zoomtools.js: Presentation tools in the zoom view: cursor, live-clone magnifier, laser pointer, pen and highlighter ink with Undo and Clear, chart and timeline crosshairs, plus a ruler on other figures
    bubble.js: Turns details into peek bubbles that smoothly enlarge in place near the viewport centre and shrink back once scrolled past
    refs.js: Numbered figures, tables, and equations, filled reference links with hover previews, and manifest-bibliography citations with a reference list
    notes.js: Inline .df-note footnotes shown as margin sidenotes when there is room, else as hover notes
    search.js: Search palette over the current page and a script-global site index, plus the index extractor (sections, inline tips, and glossary-term uses), ranking, and indexed page list
    chart.js: SVG line, scatter, pie, and vertical or horizontal grouped, stacked, and percent bar charts with default-on keyed tweens and scroll entrances, add-on chart type, scale, and legend registration, named data mappings, declarative parameter bindings, supplied intervals, keyed selection, shared x-position groups, interactive ranges, and table views
    chart-intervals.js: Ranked dot and lollipop plots with supplied intervals and dodged series in either orientation
    chart-histogram.js: Raw and pre-binned distributions with live binning, continuous log axes, and overlaid or stacked bars
    chart-heatmap.js: Matrix or record heatmaps with sequential, diverging, and log colour scales, a brushable value-range scale, and marching-squares contours with a show/hide legend chip
    chart-playback.js: Guided playback for individual numeric line charts and x-position groups, plus opt-in keyed-state checkpoints for non-line charts, with the shared timed sequence controls, authored checkpoint notes, and linked selection
    results.js: Source-mapped or authored tables with supplied intervals, sorting, heatmaps, thresholds, column filters, saved state, and opt-in keyed row animation
    matrix.js: Named evaluation records pivoted into semantic tables with keyed axes, interchangeable measures, and static fallbacks
    highlight.js: Shared keyed selection controller with startup seeds, persistence, and passive HTML and SVG participants
    stepper.js: Ordered worked examples with a Reset, Previous, and Next step pill, keyed selection groups, and linked step views
    scenarios.js: Keyed scenario comparisons with a variant chooser and shared step pill, fixed baselines, shared chart scales by unit, and supplied outcome intervals and baseline-paired differences
    data.js: Transactional named sources with record transforms, scoped chart and results filters, and raw views
    tree.js: Collapsible, keyboard-navigable tree view of nested data with expand-all, collapse-all, and capped child lists
    dropzone.js: Local file pickers and dropzones for a standalone view, local override, or explicit shared source replacement and Reset
    glossary.js: data-df-glossary site glossary merging manifest entries with indexed inline tips, with merged glossary tags, an any-tag filter, variant definitions, used-on back-links, letter jumps, and a manifest-only fallback
    sections.js: h2 colour cycle from a token with attribute overrides, and continuous left-margin section lines in a separate layer that focus blur never reaches, kept clear of the section rail
  tools/: Offline asset checker, search index exporter, and data wrapper tools
    assets.html: Folder selection, asset status and diagnostics, and selective save, download, or copy
    asset-build.js: Manifest discovery, output planning, deterministic search and data serialization, and stale checks
    asset-page.js: Asset tool page controller for folder access, previews, and exports
    refresh_data.py: Shared Python function for refreshing manifest-configured CSV and JSON wrappers in place
  vendor/katex/: Pinned KaTeX 0.19.1 minified script, stylesheet, woff2 fonts, and MIT license
  vendor/js-yaml/: Pinned js-yaml 4.1.0 minified script and MIT license
  docs/: Agent-facing setup and site structure, layout, reading, interaction, diagram, data, and offline tool references
    LIB_MAP.tsv: Index of agent references by component, description, and relative path
    interact/step-contract.md: Shared step markup, selection binding, controller, and event
    interact/shortcuts.md: Shortcut scopes, defaults, conflict diagnostics, and manifest remapping
    extend/: Public extension API, lifecycle hooks, shared controllers, events, and chart add-on registration
docs/: Human-facing beginner DocForm HTML site with a Start here orientation and live examples
  refresh-data.py: No-argument launcher for refreshing this site's CSV and JSON wrappers
  index.html: Welcome page
  pages/: Start here guides for local sites and Reader and Interactive export, feature guides, recipes, references, and glossary
  assets/: Site manifest with page tree, docs colour roles, and glossary terms; repository-derived demo data and downloadable samples; offline data wrappers and search index
scripts/: Node development tools for generating shipped assets
  build-export-library.js: Regenerates bundled export styles, fonts, and trusted scripts with Node, or verifies freshness with --check
tests/: Built-in node:test checks of module logic
